name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/todijo_ci?schema=public
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-placeholder-secret-at-least-32-characters
    services:
      postgres:
        image: quay.io/sclorg/postgresql-16-c9s
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: todijo_ci
          POSTGRESQL_USER: ci
          POSTGRESQL_PASSWORD: ci
          POSTGRESQL_DATABASE: todijo_ci
          POSTGRESQL_ADMIN_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d todijo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prepare ephemeral CI database
        run: npx prisma migrate deploy

      - name: Prepare isolated databases for PostgreSQL regression tests
        env:
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE validation LOGIN PASSWORD 'validation'"
          createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres -O ci todijo_e2e
          createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres -O validation todijo_free_test
          createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres -O validation todijo_transition_test
          createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres -O validation todijo_dashboard_test
          createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres -O validation todijo_statement_test
          createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres -O validation todijo_archive_test
          DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/todijo_e2e?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:5432/todijo_free_test?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:5432/todijo_transition_test?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:5432/todijo_dashboard_test?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:5432/todijo_statement_test?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:5432/todijo_archive_test?schema=public npx prisma migrate deploy

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/todijo_e2e?schema=public
          FREE_SELLER_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/todijo_free_test?schema=public
          SELLER_SUBSCRIPTION_TRANSITION_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/todijo_transition_test?schema=public
          SELLER_DASHBOARD_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/todijo_dashboard_test?schema=public
          SELLER_IMPORT_MEDIA_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/todijo_e2e?schema=public
          SELLER_STATEMENT_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/todijo_statement_test?schema=public
          SELLER_STORE_ARCHIVE_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/todijo_archive_test?schema=public
          TODIJO_FREE_EPHEMERAL: "1"
          TODIJO_CI_DISPOSABLE_DATABASE: "1"
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Pull verified Node.js base image for Docker build
        env:
          NODE_BASE_TAG: 24.15.0-bookworm-slim
          # Official Node image index digest from Docker Hub; keep mirror/fallback content-identical.
          NODE_BASE_DIGEST: sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
        run: |
          set -euo pipefail
          mirror_image="mirror.gcr.io/library/node:${NODE_BASE_TAG}@${NODE_BASE_DIGEST}"
          docker_hub_image="docker.io/library/node:${NODE_BASE_TAG}@${NODE_BASE_DIGEST}"

          if docker pull "$mirror_image"; then
            source_image="mirror.gcr.io/library/node:${NODE_BASE_TAG}"
          else
            echo "::warning::Node image cache unavailable; falling back to the official Docker Hub image at the same digest."
            docker pull "$docker_hub_image"
            source_image="docker.io/library/node:${NODE_BASE_TAG}"
          fi

          docker image tag "$source_image" todijo-node-ci:24.15.0-bookworm-slim

      - name: Build production image
        run: >-
          docker build --pull=false
          --build-arg NODE_BASE_IMAGE=todijo-node-ci:24.15.0-bookworm-slim
          --tag todijo-security-phase1 .

      - name: Verify production runtime contents
        run: |
          docker run --rm --entrypoint sh todijo-security-phase1 -c '
            test "$(id -u)" = "1001"
            test "$(id -g)" = "1001"
            test -x ./scripts/production-entrypoint.sh
            test -x ./node_modules/.bin/prisma
            test -f ./prisma/schema.prisma
            test -d ./prisma/migrations
            command -v curl
          '

      - name: Test migration-gated production startup
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        run: bash scripts/test-production-entrypoint.sh todijo-security-phase1

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/todijo_browser?schema=public
      PLAYWRIGHT_DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/todijo_browser?schema=public
      TODIJO_CI_DISPOSABLE_DATABASE: "1"
    services:
      postgres:
        image: quay.io/sclorg/postgresql-16-c9s
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: todijo_e2e
          POSTGRESQL_USER: e2e
          POSTGRESQL_PASSWORD: e2e
          POSTGRESQL_DATABASE: todijo_e2e
          POSTGRESQL_ADMIN_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d todijo_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium browser only
        run: npx playwright install chromium

      - name: Prepare dedicated disposable Playwright database
        env:
          PGPASSWORD: e2e
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE validation LOGIN PASSWORD 'validation'"
          createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres -O validation todijo_browser

      - name: Prepare ephemeral browser-test database
        run: npx prisma migrate deploy

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
