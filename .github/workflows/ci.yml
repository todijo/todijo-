name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/todijo_ci?schema=public
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-placeholder-secret-at-least-32-characters
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: todijo_ci
        ports:
          - 5432:5432
          - 55432:5432
          - 65431:5432
        options: >-
          --health-cmd "pg_isready -U ci -d todijo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prepare ephemeral CI database
        run: npx prisma migrate deploy

      - name: Prepare isolated databases for PostgreSQL regression tests
        env:
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -p 5432 -U ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE validation LOGIN PASSWORD 'validation'"
          createdb -h 127.0.0.1 -p 5432 -U ci --maintenance-db=postgres -O ci todijo_e2e
          createdb -h 127.0.0.1 -p 5432 -U ci --maintenance-db=postgres -O validation todijo_free_test
          createdb -h 127.0.0.1 -p 5432 -U ci --maintenance-db=postgres -O validation todijo_transition_test
          createdb -h 127.0.0.1 -p 5432 -U ci --maintenance-db=postgres -O validation todijo_dashboard_test
          DATABASE_URL=postgresql://ci:ci@127.0.0.1:55432/todijo_e2e?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:65431/todijo_free_test?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:65431/todijo_transition_test?schema=public npx prisma migrate deploy
          DATABASE_URL=postgresql://validation:validation@127.0.0.1:65431/todijo_dashboard_test?schema=public npx prisma migrate deploy

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:55432/todijo_e2e?schema=public
          FREE_SELLER_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:65431/todijo_free_test?schema=public
          SELLER_SUBSCRIPTION_TRANSITION_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:65431/todijo_transition_test?schema=public
          SELLER_DASHBOARD_TEST_DATABASE_URL: postgresql://validation:validation@127.0.0.1:65431/todijo_dashboard_test?schema=public
          SELLER_STATEMENT_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/todijo_ci?schema=public
          TODIJO_FREE_EPHEMERAL: "1"
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Build production image
        run: docker build --tag todijo-security-phase1 .

      - name: Verify production runtime contents
        run: |
          docker run --rm --entrypoint sh todijo-security-phase1 -c '
            test "$(id -u)" = "1001"
            test "$(id -g)" = "1001"
            test -x ./scripts/production-entrypoint.sh
            test -x ./node_modules/.bin/prisma
            test -f ./prisma/schema.prisma
            test -d ./prisma/migrations
            command -v curl
          '

      - name: Test migration-gated production startup
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: todijo_ci
        run: bash scripts/test-production-entrypoint.sh todijo-security-phase1

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      DATABASE_URL: postgresql://e2e:e2e@127.0.0.1:5432/todijo_e2e?schema=public
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: todijo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d todijo_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium browser only
        run: npx playwright install chromium

      - name: Prepare ephemeral browser-test database
        run: npx prisma migrate deploy

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
